name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable EXE
        shell: pwsh
        run: .\build_windows_exe.ps1

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCS-RadioForge-windows-portable
          path: release/DCS-RadioForge-v0.1.3-windows-portable.zip
          if-no-files-found: error

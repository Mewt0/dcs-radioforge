name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile server.py voicekit.py run.py radioforge_launcher.py

      - name: Validate web assets exist
        shell: pwsh
        run: |
          $required = @("web/index.html", "web/app.js", "web/styles.css")
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required asset: $path"
            }
          }

      - name: Start local server and check health
        shell: pwsh
        run: |
          $proc = Start-Process python -ArgumentList "server.py --host 127.0.0.1 --port 8765" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health"
                if ($response.ok -eq $true) {
                  $ok = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ok) {
              throw "Health check failed"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
